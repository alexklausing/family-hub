<!DOCTYPE html>
<html>
<style>
.group:hover .fg {
  transform: translateX(-80px);
}
</style>
<body>
<div class="group" style="position: relative; overflow: hidden; width: 300px; height: 50px; background: red;">
  <div style="position: absolute; right: 0; top: 0; bottom: 0; width: 80px;" onclick="alert('deleted!')"></div>
  <div class="fg" style="position: relative; width: 100%; height: 100%; background: blue; transition: transform 0.3s;" onclick="alert('foreground')"></div>
</div>
</body>
</html>
